name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Run tests
        run: |
          xcodebuild test \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -destination 'platform=iOS Simulator,name=iPhone 16'
