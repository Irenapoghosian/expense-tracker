excluded:
  - ExpenseTrackerTests
  - ExpenseTracker.xcdatamodeld

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - redundant_type_annotation

line_length:
  warning: 130
  error: 160

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

file_length:
  warning: 400
  error: 500

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - i
